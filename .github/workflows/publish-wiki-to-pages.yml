name: Publish Wiki to Pages

on:
  gollum:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout wiki
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: Create output directory
        run: mkdir -p _site

      - name: Convert Markdown to HTML
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

          echo '<html><head><meta charset="utf-8"><title>Wiki 文档</title></head><body>' > _site/index.html
          echo '<h1>📚 Wiki 文档</h1><ul>' >> _site/index.html

          for file in wiki/*.md; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              htmlname="${filename%.md}.html"
              pandoc "$file" -o "_site/$htmlname" -f markdown -t html -s
              echo "<li><a href=\"$htmlname\">$(basename "$filename" .md)</a></li>" >> _site/index.html
            fi
          done

          echo '</ul></body></html>' >> _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
